name: CMake Build Matrix

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ master, dev ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-24.04,
            cc: "/usr/bin/gcc",
            cxx: "/usr/bin/g++"
          }
          - {
            name: "Ubuntu Latest Clang",
            os: ubuntu-24.04,
            cc: "/usr/bin/clang",
            cxx: "/usr/bin/clang++"
          }

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang clang-format clang-tidy \
            zlib1g-dev pkg-config gdb

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCC=${{matrix.config.cc}}
          -DCXX=${{matrix.config.cxx}}
          -DCLANG_FORMAT_BIN=/usr/bin/clang-format
          -DCLANG_TIDY_BIN=/usr/bin/clang-tidy

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j 2
